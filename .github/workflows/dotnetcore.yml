name: .NET Core

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack AutoMocker.NSubstitute/AutoMocker.NSubstitute.csproj --configuration Release --no-build --output packages

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: packages
          path: packages/
