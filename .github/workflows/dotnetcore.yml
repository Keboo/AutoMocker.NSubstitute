name: Build and deploy

on:
  push:
    paths-ignore:
    - 'README.md'
    - 'docs/**'
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: dotnet restore
        run: dotnet restore

      - name: dotnet build
        run: dotnet build --configuration Release --no-restore

      - name: dotnet test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: dotnet pack
        run: dotnet pack --configuration Release --no-build -o ./NuGet

      # Test that MSBuild properties to disable generators work correctly
      - name: Test Generator Disable Properties
        run: |
          <# Create a local NuGet source directory with the packed packages #>
          New-Item -ItemType Directory -Force -Path ./nupkgs
          Copy-Item -Path ./NuGet/*.nupkg -Destination ./nupkgs/

          <# Build and run the disable tests using the local NuGet package #>
          <# The test project's NuGet.config points to ../../nupkgs relative to the project #>
          dotnet test --project ./GeneratorTests/AutoMocker.NSubstitute.Generator.DisableTests/AutoMocker.NSubstitute.Generator.DisableTests.csproj `
            --configuration Release `
            --verbosity normal `
            /p:LocalNuGetSource=true

      - name: Upload NuGet artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: NuGet
          path: ./NuGet
          if-no-files-found: error

  test-nsubstitute-versions:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Supports exact versions (e.g. "5.3.0"), major wildcards (e.g. "6.*"),
        # and major.minor wildcards (e.g. "6.2.*") - these are resolved to the
        # latest matching stable version in the "Resolve NSubstitute version" step.
        nsubstitute-version: [ "5.3.0", "6.*" ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve NSubstitute version
        id: nsubstitute
        run: |
          $requested = "${{ matrix.nsubstitute-version }}"
          if ($requested -match '^(\d+)(\.\d+)?\.\*$') {
            $prefix = "$($matches[1])$($matches[2])"
            $index = Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/nsubstitute/index.json"
            $resolved = $index.versions |
              Where-Object { $_ -match "^$([regex]::Escape($prefix))\." -and $_ -notmatch '-' } |
              Sort-Object { [version]($_ -replace '-.*$') } |
              Select-Object -Last 1
            if (-not $resolved) {
              throw "Unable to resolve a version for NSubstitute matching '$requested'"
            }
            Write-Host "Resolved '$requested' to NSubstitute $resolved"
            "version=$resolved" >> $env:GITHUB_OUTPUT
          } else {
            "version=$requested" >> $env:GITHUB_OUTPUT
          }

      - name: dotnet restore
        run: dotnet restore /p:NSubstituteVersion=${{ steps.nsubstitute.outputs.version }}

      - name: dotnet build
        run: dotnet build --configuration Release --no-restore /p:NSubstituteVersion=${{ steps.nsubstitute.outputs.version }}

      - name: dotnet test
        run: dotnet test --configuration Release --no-build --verbosity normal /p:NSubstituteVersion=${{ steps.nsubstitute.outputs.version }}

  automerge:
    if: github.event_name == 'pull_request'
    needs: [ build, test-nsubstitute-versions ]
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: fastify/github-action-merge-dependabot@v3.15.0

  deploy-nuget:
    if: github.event_name != 'pull_request'
    needs: [ build, test-nsubstitute-versions ]
    runs-on: ubuntu-latest

    # Required for NuGet trusted publishing through GitHub OIDC.
    permissions:
      id-token: write

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: NuGet

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet (Trusted Publishing)
        run: dotnet nuget push ${{ github.workspace }}/*nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
